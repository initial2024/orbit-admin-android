name: Orbit Mail stable signed APK (protected manual)
on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "Type PUBLISH_SIGNED_STABLE only after real-device and server gates pass"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: orbit-mail-stable-release
  cancel-in-progress: false
jobs:
  stable-android:
    if: github.ref == 'refs/heads/main' && inputs.acknowledgement == 'PUBLISH_SIGNED_STABLE'
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Guard production keystore secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ORBIT_RELEASE_KEYSTORE_BASE64 }}
          ORBIT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEYSTORE_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          test -n "$ORBIT_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ORBIT_RELEASE_KEY_ALIAS"
          test -n "$ORBIT_RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/orbit-release.jks"
          test -s "$RUNNER_TEMP/orbit-release.jks"
          echo "ORBIT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/orbit-release.jks" >> "$GITHUB_ENV"
      - name: Build and test signed release
        shell: bash
        env:
          ORBIT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEYSTORE_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify stable version, signature and SHA-256
        id: seal
        shell: bash
        env:
          ORBIT_EXPECTED_CERT_SHA256: ${{ vars.ORBIT_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Refuse unsigned/unreviewed -dev version' >&2; exit 1;
          }
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -s "$SRC"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APK_SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APK_SIGNER"
          # Fail closed when the protected environment did not pin a certificate.
          # The digest is public verification metadata, not a keystore secret.
          [[ "$ORBIT_EXPECTED_CERT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || {
            echo 'ORBIT_RELEASE_CERT_SHA256 is missing or malformed (Production variable)' >&2
            exit 1
          }
          CERT_REPORT="$("$APK_SIGNER" verify --verbose --print-certs "$SRC")"
          CERTS="$(printf '%s\n' "$CERT_REPORT" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')"
          test "$(printf '%s\n' "$CERTS" | grep -Ec '^[0-9a-fA-F]{64}
          cp "$SRC" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "tag=orbit-mail-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$NAME.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish immutable signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.seal.outputs.tag }}
          APK: ${{ steps.seal.outputs.apk }}
          CHECKSUM: ${{ steps.seal.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite' >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" "$CHECKSUM" --target "$GITHUB_SHA" \
            --title "Orbit Mail $TAG" \
            --notes "Stable user APK. Produced only after protected signing and manual release approval."
      - name: Remove local keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/orbit-release.jks"
)" -eq 1 || {
            echo 'Expected exactly one valid APK certificate digest' >&2
            exit 1
          }
          ACTUAL_CERT="$(printf '%s\n' "$CERTS" | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="$(printf '%s' "$ORBIT_EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo 'APK signer differs from pinned Production certificate: refusing release' >&2
            exit 1
          fi
          echo "Verified pinned production certificate (SHA-256): $ACTUAL_CERT"
          NAME="Orbit-Mail-v${VERSION}.apk"
          cp "$SRC" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "tag=orbit-mail-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$NAME.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish immutable signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.seal.outputs.tag }}
          APK: ${{ steps.seal.outputs.apk }}
          CHECKSUM: ${{ steps.seal.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite' >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" "$CHECKSUM" --target "$GITHUB_SHA" \
            --title "Orbit Mail $TAG" \
            --notes "Stable user APK. Produced only after protected signing and manual release approval."
      - name: Remove local keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/orbit-release.jks"
