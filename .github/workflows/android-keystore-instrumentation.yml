name: Android Keystore native-device instrumentation
on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/de/kango99w/orbitadmin/NativeDeviceClient.kt"
      - "app/src/main/java/de/kango99w/orbitadmin/P256SignatureFormat.kt"
      - "app/build.gradle.kts"
      - ".github/workflows/android-keystore-instrumentation.yml"

permissions:
  contents: read

concurrency:
  group: orbit-android-keystore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  keystore-android35:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "No /dev/kvm; Android emulator test unavailable" >&2
            exit 1
          fi
      - name: Run Android 35 Keystore and session instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orbit-native-keystore-instrumentation
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
