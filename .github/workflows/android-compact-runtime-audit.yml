name: Android compact runtime and installed-storage audit
on:
  push:
    branches: [feat/secure-admin-shell-v0-20261107]
    paths:
      - ".github/workflows/android-compact-runtime-audit.yml"
      - "app/proguard-rules.pro"
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-compact-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  ORBIT_FIREBASE_APP_ID: ${{ vars.ORBIT_FIREBASE_PREVIEW_APP_ID }}
  ORBIT_FIREBASE_API_KEY: ${{ vars.ORBIT_FIREBASE_PREVIEW_API_KEY }}
  ORBIT_FIREBASE_SENDER_ID: ${{ vars.ORBIT_FIREBASE_PREVIEW_SENDER_ID }}
  ORBIT_FIREBASE_PROJECT_ID: ${{ vars.ORBIT_FIREBASE_PREVIEW_PROJECT_ID }}

jobs:
  compact-android35:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.13 directly from official CDN (SHA256-pinned)
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/gradle-8.13-bin.zip"
          SHA="20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"
          for attempt in 1 2 3 4; do
            if curl --fail --location --silent --show-error \
                  --connect-timeout 20 --max-time 220 \
                  "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip" -o "$ZIP"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Official Gradle distribution unavailable: stop without publishing" >&2
              exit 1
            fi
            sleep $((attempt * 8))
          done
          printf '%s  %s\n' "$SHA" "$ZIP" | sha256sum --check --status ||
            { echo "Gradle distribution SHA256 mismatch" >&2; exit 1; }
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Prewarm Kotlin toolchain with bounded transient network retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gradle --no-daemon --no-configuration-cache :app:assembleDebug :app:assembleCompact; then
              echo "Kotlin and Android dependencies ready."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Kotlin compiler dependency unavailable after three attempts" >&2
              exit 1
            fi
            sleep $((attempt * 12))
          done
      - name: Enable KVM for Android 35 emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "KVM unavailable; cannot validate compact runtime" >&2
            exit 1
          fi
      - name: Require Firebase project for representative compact measurements
        shell: bash
        run: |
          set -euo pipefail
          for key in ORBIT_FIREBASE_APP_ID ORBIT_FIREBASE_API_KEY ORBIT_FIREBASE_SENDER_ID ORBIT_FIREBASE_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing $key: a compact APK without Firebase cannot be compared to the full-feature preview" >&2
              exit 1
            fi
          done
      - name: Run minified Android instrumentation and size/RAM comparison
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: |
            gradle --no-daemon --no-configuration-cache -Porbit.instrumentCompact=true :app:assembleDebug :app:assembleCompact :app:connectedCompactAndroidTest
            bash scripts/ci/audit-compact-installed-storage.sh
      - name: Upload minified instrumentation and storage audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-compact-android35-runtime-audit
          retention-days: 7
          if-no-files-found: ignore
          path: |
            compact-storage-audit/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
