name: Publish Orbit Mail debug APK (manual GitHub release)
on:
  push:
    branches: [feat/secure-admin-shell-v0-20261107]
    paths:
      - ".github/workflows/android-preview-release.yml"
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "Type PUBLISH_TEST_APK to publish a debug APK as a GitHub pre-release"
        required: true
        type: string

permissions:
  contents: read
jobs:
  build-preview:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.acknowledgement == 'PUBLISH_TEST_APK')
      || (github.event_name == 'push' && github.ref == 'refs/heads/feat/secure-admin-shell-v0-20261107' && contains(github.event.head_commit.message, '[publish-debug]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and accepted licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and package
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify debug APK and generate publish metadata
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]
          test -s app/build/outputs/apk/debug/app-debug.apk
          NAME="Orbit-Mail-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          printf "%s\n" "Orbit Mail $VERSION — development/test APK only." "Built from GitHub commit $GITHUB_SHA." "This APK uses the CI debug key, not a stable production signing certificate." "Installing over a different signature may fail. Uninstalling destroys local browser/Keystore state." "Native API requires the separate server release and explicit enrollment; not production verified." > INSTALL_NOTES.txt
          ZIP="Orbit-Mail-v${VERSION}-debug.zip"
          zip -9 "$ZIP" "$NAME" "$NAME.sha256" INSTALL_NOTES.txt >/dev/null
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          TAG="orbit-mail-v${VERSION}-${GITHUB_SHA:0:12}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Publish immutable prerelease (direct APK asset)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.seal.outputs.tag }}
          APK: ${{ steps.seal.outputs.apk }}
          CHECKSUM: ${{ steps.seal.outputs.sha }}
          ZIP: ${{ steps.seal.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing debug release" >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" "$CHECKSUM" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "Orbit Mail $TAG (debug test)" \
            --notes "v0.8.2-dev DEBUG / PRERELEASE ONLY. This GitHub Release includes a direct APK and a ZIP containing the same APK, SHA256, and installation notes. Android instrumentation security tests and live server enrollment still gate final approval. Debug signing may prevent in-place upgrades; uninstall clears local credentials. Native Worker API + D1 production deployment still pending." \
            --prerelease
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
          echo "ZIP: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          echo "SHA256 checksum: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${CHECKSUM}"
