name: Publish Orbit Mail debug APK (manual GitHub release)
on:
  push:
    branches: [feat/secure-admin-shell-v0-20261107]
    paths:
      - ".github/workflows/android-preview-release.yml"
      - "app/**"
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "Type PUBLISH_TEST_APK to publish a debug APK as a GitHub pre-release"
        required: true
        type: string

permissions:
  contents: read
jobs:
  build-preview:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.acknowledgement == 'PUBLISH_TEST_APK')
      || (github.event_name == 'push' && github.ref == 'refs/heads/feat/secure-admin-shell-v0-20261107' && contains(github.event.head_commit.message, '[publish-debug]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and accepted licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and package
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify debug APK and generate publish metadata
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]
          test -s app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='de.kango99w.orbitadmin.nativepreview'"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='${VERSION}'"
          APK_SIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          NAME="Orbit-Mail-Native-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          printf "%s\n" \
            "Orbit Mail Native Preview $VERSION — DEBUG ONLY." \
            "Package: de.kango99w.orbitadmin.nativepreview (side-by-side, independent Android app)." \
            "Built from pinned GitHub source commit $GITHUB_SHA." \
            "Administrator mailbox screen, login and TOTP are native Jetpack Compose." \
            "No in-app administrator WebView exists; advanced website links open the external browser explicitly." \
            "This preview does not share website CookieManager, Android Keystore, or login state with the installed old Orbit Mail package." \
            "The CI Debug signing key is temporary; a future preview may not install over this one." \
            "Do NOT uninstall your old Orbit Mail v0.9.4 to test this APK." \
            "Ordinary account direct native password/TOTP API requires undeployed backend Draft PR #620." \
            "Administrator production accounts and real mail content remain unverified on physical Android hardware." > INSTALL_NOTES.txt
          ZIP="Orbit-Mail-Native-v${VERSION}-debug.zip"
          zip -9 "$ZIP" "$NAME" "$NAME.sha256" INSTALL_NOTES.txt >/dev/null
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          TAG="orbit-mail-v${VERSION}-${GITHUB_SHA:0:12}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Publish immutable prerelease (direct APK asset)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.seal.outputs.tag }}
          APK: ${{ steps.seal.outputs.apk }}
          CHECKSUM: ${{ steps.seal.outputs.sha }}
          ZIP: ${{ steps.seal.outputs.zip }}
          VERSION: ${{ steps.seal.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing debug release" >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" "$CHECKSUM" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "Orbit Mail Native Preview $TAG (debug)" \
            --notes "$VERSION NATIVE ANDROID DEBUG PREVIEW. Android package de.kango99w.orbitadmin.nativepreview installs side-by-side with the older Orbit Mail package. Real administrator login/TOTP and mailbox UI are Jetpack Compose + first-party administrator API (not an in-app admin WebView). External browser required for advanced security/domain actions. Signing is ephemeral CI Debug, not the previous v0.9.4 key; no in-place upgrade claim. Ordinary native account login backend PR #620 remains Draft and undeployed. Real-phone administrator acceptance and mailbox/create checks have NOT been completed." \
            --prerelease
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
          echo "ZIP: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          echo "SHA256 checksum: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${CHECKSUM}"
