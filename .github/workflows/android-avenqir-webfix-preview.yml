name: Orbit AVENQIR WebView recovery side-by-side TEST APK
on:
  push:
    branches: [fix/avenqir-webview-recovery-20261124]
    paths:
      - ".github/workflows/android-avenqir-webfix-preview.yml"
      - "app/**"
permissions:
  contents: write
concurrency:
  group: orbit-avenqir-webfix-test
  cancel-in-progress: true
jobs:
  build-smoke-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build + regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ORBIT_RELEASE_KEYSTORE_FILE:-}"
          gradle --no-daemon --no-configuration-cache \
            :app:testDebugUnitTest :app:testCompactPreviewUnitTest \
            :app:assembleDebug :app:assembleCompactPreview
      - name: Verify APK package, signing and version
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          SIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          ORIGINAL="app/build/outputs/apk/debug/app-debug.apk"
          PREVIEW="app/build/outputs/apk/compactPreview/app-compactPreview.apk"
          test -s "$ORIGINAL" && test -s "$PREVIEW"
          "$SIGNER" verify --verbose --print-certs "$PREVIEW" | tee signer-evidence.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' signer-evidence.txt
          "$AAPT" dump badging "$ORIGINAL" | grep -F "package: name='de.kango99w.orbitadmin'"
          "$AAPT" dump badging "$PREVIEW" | grep -F "package: name='de.kango99w.orbitadmin.compactpreview'"
          "$AAPT" dump badging "$PREVIEW" | grep -F "versionCode='47' versionName='0.9.30-compactpreview'"
          echo "PREVIEW_SIGNATURE=EPHEMERAL_DEBUG_ONLY"
          echo "ORIGINAL_PRODUCTION_SIGNING=NOT_USED"
      - name: Enable emulator KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android 35 emulator side-by-side smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: bash scripts/ci/smoke-compact-side-by-side.sh
      - name: Seal APK, ZIP, SHA256, and test limitations
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          APK="Orbit-Mail-AVENQIR-WebFix-v0.9.30-COMPACT-TEST.apk"
          ZIP="Orbit-Mail-AVENQIR-WebFix-v0.9.30-COMPACT-TEST.zip"
          cp app/build/outputs/apk/compactPreview/app-compactPreview.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat > INSTALL_NOTES.txt <<EOF
          AVENQIR WebView main-frame recovery / Orbit Mail v0.9.30 test only.
          Source commit: $GITHUB_SHA
          APK package: de.kango99w.orbitadmin.compactpreview
          Independent side-by-side app ID; original Orbit Mail untouched.
          Signing: GitHub CI temporary DEBUG certificate. NOT stable or Production.
          If you have an earlier compactpreview signed differently, Android will require
          uninstalling only that compactpreview app; all its app-local data will be lost.
          Do NOT uninstall your existing de.kango99w.orbitadmin production app for this test.
          Changed: main-frame-only diagnostics, retry and browser fallback; no SSL bypass.
          Security: AVENQIR WebView isolated from mail cookies; password/TOTP unchanged.
          Limits: emulator startup passes but HTTPS site, real vivo device, login,
          actual mail, upload and real network restoration remain unverified.
          EOF
          zip -9 "$ZIP" "$APK" "$APK.sha256" INSTALL_NOTES.txt signer-evidence.txt \
            compact-preview-evidence/summary.md >/dev/null
          unzip -t "$ZIP" >/dev/null
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=orbit-avenqir-webfix-v0930-test-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-avenqir-webfix-test
          retention-days: 14
          if-no-files-found: error
          path: |
            Orbit-Mail-AVENQIR-WebFix-v0.9.30-COMPACT-TEST.*
            signer-evidence.txt
            INSTALL_NOTES.txt
            compact-preview-evidence/summary.md
      - name: Publish verified test APK and ZIP, never stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.pack.outputs.apk }}
          ZIP: ${{ steps.pack.outputs.zip }}
          TAG: ${{ steps.pack.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Immutable test release exists; refuse overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" "$ZIP" "$ZIP.sha256" \
            INSTALL_NOTES.txt --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Orbit Mail AVENQIR WebView recovery v0.9.30 TEST ONLY" \
            --notes-file INSTALL_NOTES.txt
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
          echo "ZIP: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ZIP"
      - name: Preserve failed test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-avenqir-webfix-failure
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            compact-preview-evidence/
