name: Orbit 0.9.30 verified Debug APK (PRERELEASE ONLY)
on:
  push:
    branches: [release-candidate/orbit-avenqir-v0.9.30-20261123]
    paths: [.github/workflows/android-v0930-verified-debug-release.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish-pinned-ci-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify pinned CI provenance and download installable Debug APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          SOURCE_SHA="2f06ccfad9abe240d929097a0cf962c9496baa4a"
          TEST_RUN="45198205999"
          INSTRUMENTATION_RUN="45198206033"
          test "$(gh api "repos/$REPO/actions/runs/$TEST_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/actions/runs/$TEST_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$INSTRUMENTATION_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/actions/runs/$INSTRUMENTATION_RUN" --jq '.conclusion')" = success
          mkdir downloaded
          gh run download "$TEST_RUN" --repo "$REPO" --name orbit-admin-unsigned-debug --dir downloaded
          test -s downloaded/app-debug.apk
          echo "DEBUG_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "PINNED_CI_VALIDATED=YES"
      - name: Validate Android signing and exact original package
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "build-tools;35.0.0"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging downloaded/app-debug.apk | grep -F "package: name='de.kango99w.orbitadmin'"
          "$AAPT" dump badging downloaded/app-debug.apk | grep -F "versionCode='47' versionName='0.9.30'"
          "$APKSIGNER" verify --verbose --print-certs downloaded/app-debug.apk > debug-cert-evidence.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' debug-cert-evidence.txt
          echo "CI_DEBUG_SIGNED=YES"
          echo "PRODUCTION_SIGNED=NO"
      - name: Prepare immutable test APK and ZIP distribution
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK="Orbit-Mail-v0.9.30-DEBUG-TEST.apk"
          ZIP="Orbit-Mail-v0.9.30-DEBUG-TEST.zip"
          cp downloaded/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat > INSTALL_NOTES.txt <<EOF
          Orbit Mail 0.9.30 DEBUG-ONLY Android APK (NOT PRODUCTION).
          Original package: de.kango99w.orbitadmin; versionCode=47.
          Source commit: $DEBUG_SOURCE_SHA
          Pinned success: debug build #45198205999; Android 35 Keystore emulator #45198206033.
          APK signed using the ephemeral CI DEBUG key, not the protected Production keystore.
          Owner reports no currently installed Orbit Mail; first installation only.
          An official future Production APK WILL have a different signing certificate.
          Its installation will require uninstalling this DEBUG test app, losing local app data and requiring re-login.
          Do not store important sessions in this test version.
          No Vivo physical-device login, actual mailbox, server rollout or uploads verified.
          EOF
          zip -9 "$ZIP" "$APK" "$APK.sha256" INSTALL_NOTES.txt >/dev/null
          unzip -t "$ZIP" >/dev/null
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=orbit-v0.9.30-debug-only-pinned-${DEBUG_SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Publish immutable signed DEBUG-only prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.package.outputs.apk }}
          ZIP: ${{ steps.package.outputs.zip }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Immutable tag already exists: refuse overwrite" >&2; exit 1
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" "$ZIP" "$ZIP.sha256" INSTALL_NOTES.txt \
            --repo "$GITHUB_REPOSITORY" --target "$DEBUG_SOURCE_SHA" --prerelease \
            --title "Orbit Mail v0.9.30 signed Debug TEST ONLY" --notes-file INSTALL_NOTES.txt
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
          echo "ZIP: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ZIP"
