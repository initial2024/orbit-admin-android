name: Orbit v0.9.40 stable candidate (UNSIGNED preflight)
on:
  push:
    branches: ["fix/avenqir-native-passkey-v0933-20261124"]
  pull_request:
    paths:
      - ".github/workflows/android-stable-candidate-verify.yml"
      - "app/**"
permissions:
  contents: read
concurrency:
  group: orbit-stable-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate original release identity, no signing secrets
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "de.kango99w.orbitadmin"' app/build.gradle.kts
          grep -F 'versionCode = 57' app/build.gradle.kts
          grep -F 'versionName = "0.9.40"' app/build.gradle.kts
          grep -F 'isMinifyEnabled = true' app/build.gradle.kts
          grep -F 'isShrinkResources = true' app/build.gradle.kts
          test -z "${ORBIT_RELEASE_KEYSTORE_FILE:-}"
          echo "UNSIGNED preflight only; Production keys are not exposed to this workflow"
      - name: Build and unit test Debug plus minified Release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache \
            :app:testDebugUnitTest :app:testReleaseUnitTest \
            :app:assembleDebug :app:assembleRelease
      - name: Check unsigned release manifest and compact ratio
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="$(find app/build/outputs/apk/release -maxdepth 1 \
            -type f -name 'app-release*.apk' | head -n 1)"
          test -s "$DEBUG"
          test -n "$RELEASE" && test -s "$RELEASE"
          "$AAPT" dump badging "$RELEASE" | grep -F "package: name='de.kango99w.orbitadmin'"
          "$AAPT" dump badging "$RELEASE" | grep -F "versionCode='57' versionName='0.9.40'"
          DEBUG_SIZE="$(wc -c < "$DEBUG")"
          RELEASE_SIZE="$(wc -c < "$RELEASE")"
          test "$RELEASE_SIZE" -lt "$((DEBUG_SIZE * 80 / 100))"
          {
            echo "## Orbit Mail + AVENQIR stable 0.9.40 candidate"
            echo "Commit: $GITHUB_SHA"
            echo "Original package: de.kango99w.orbitadmin"
            echo "versionCode: 57; versionName: 0.9.40"
            echo "Debug bytes: $DEBUG_SIZE; R8 unsigned release bytes: $RELEASE_SIZE"
            echo "Unit tests and release variant compiles: PASS"
            echo "Signing: NOT PERFORMED. DO NOT DISTRIBUTE UNSIGNED APK."
            echo "Production release remains blocked until reviewed main branch,"
            echo "real-device/server checks and manual PUBLISH_SIGNED_STABLE approval."
          } | tee stable-candidate-evidence.txt
          cat stable-candidate-evidence.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish preflight text evidence only
        uses: actions/upload-artifact@v4
        with:
          name: orbit-v0940-unsigned-preflight-evidence
          path: stable-candidate-evidence.txt
          retention-days: 14
          if-no-files-found: error
